services:
  pager-smtpd:
    build: .
    image: ofloo/pagersmtpd:latest
    container_name: pager-smtpd
    restart: unless-stopped
    env_file: .env
    ports:
      # Lab: bind host 127.0.0.1:2525:8025. Publiek MX: "25:8025"
      - "${SMTP_HOST_BIND:-127.0.0.1}:${SMTP_HOST_PORT:-2525}:8025"
    environment:
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: "8025"
    # Hardening: nothing is written to disk, drop every capability.
    # Run directly as non-root (no root, no capabilities at all).
    user: "${PAGER_UID:-10000}:${PAGER_GID:-10000}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8025),3);s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
