services:
  pager-smtpd:
    build: .
    image: ofloo/pagersmtpd:latest
    container_name: pager-smtpd
    restart: unless-stopped
    env_file: .env
    ports:
      # Lab: bind host 127.0.0.1:2525:8025. Publiek MX: "25:8025"
      - "${SMTP_HOST_BIND:-127.0.0.1}:${SMTP_HOST_PORT:-2525}:8025"
    environment:
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: "8025"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
