# pf rules for the PagerSMPTd Bastille jail — merge into /etc/pf.conf on the host.
# Find the jail's loopback alias first:  bastille cmd <jail> ifconfig lo0  (e.g. 127.0.0.2)
# and set:  set skip on lo0   (already default on most installs)

# Inbound SMTP from the internet -> jail port 8025
# rdr on $ext_if inet proto tcp from any to ($ext_if) port 25 -> 127.0.0.2 port 8025

# Outbound NAT for the jail (HTTPS to pager.ofloo.io / share.h4ck.io)
# nat on $ext_if inet from 127.0.0.2 to any -> ($ext_if)
