name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax checks
        run: |
          python3 -m py_compile smtp_server.py tests/*.py
          bash -n build.sh
          bash -n tests/run_tests.sh
          bash -n tests/e2e.sh
          sh -n entrypoint.sh
          sh -n pager.sh
          sh -n bastille/root/usr/local/etc/rc.d/pagersmtpd

      - name: Integration tests (mock pager + share)
        run: bash tests/run_tests.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pagersmtpd:test .
      - name: Container smoke test (non-root, read-only, no caps)
        run: |
          docker run -d --name smoke -p 127.0.0.1:12525:8025 \
            --read-only --tmpfs /tmp:size=16m --cap-drop ALL \
            --user 10000:10000 \
            -e PAGER_DOMAIN=test.local \
            -e PAGER_URL=https://pager.ofloo.io \
            -e SHARE_URL=https://share.h4ck.io \
            pagersmtpd:test
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = "healthy" ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' smoke | grep -qx healthy
          python3 - <<'PY'
          import smtplib, sys
          s = smtplib.SMTP("127.0.0.1", 12525, timeout=10)
          s.ehlo("ci")
          _, ehlo = s.ehlo("ci")
          assert b"AUTH" not in ehlo
          code, msg = s.docmd("MAIL", "FROM:<ci@example.org>")
          assert code == 250, (code, msg)
          code, msg = s.docmd("RCPT", "TO:<00000000-0000-0000-0000-000000000000@evil.example>")
          assert code == 550, (code, msg)
          s.quit()
          print("container smoke OK")
          PY
          docker rm -f smoke
